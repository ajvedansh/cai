version: '3.9'

networks:
  cai-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:

services:
  # ── Infrastructure ──────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: cai-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: cai_admin
      MONGO_INITDB_ROOT_PASSWORD: cai_secret_local
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./infra/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - cai-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: cai-redis
    restart: unless-stopped
    command: redis-server --requirepass cai_redis_local --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - cai-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'cai_redis_local', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DB Browser ──────────────────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: cai-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: cai_admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: cai_secret_local
      ME_CONFIG_MONGODB_URL: mongodb://cai_admin:cai_secret_local@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    networks:
      - cai-network
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Services ────────────────────────────────────────────────────
  channel-connector-service:
    build:
      context: .
      dockerfile: apps/channel-connector-service/Dockerfile
    container_name: cai-channel-connector
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file:
      - ./apps/channel-connector-service/.env.docker
    environment:
      NODE_ENV: development
    networks:
      - cai-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  signal-parser-service:
    build:
      context: ./apps/signal-parser-service
      dockerfile: Dockerfile
    container_name: cai-signal-parser
    restart: unless-stopped
    ports:
      - '3003:3003'
    env_file:
      - ./apps/signal-parser-service/.env.docker
    environment:
      APP_ENV: development
    networks:
      - cai-network
    depends_on:
      redis:
        condition: service_healthy

  trade-call-service:
    build:
      context: .
      dockerfile: apps/trade-call-service/Dockerfile
    container_name: cai-trade-call
    restart: unless-stopped
    ports:
      - '3004:3004'
    env_file:
      - ./apps/trade-call-service/.env.docker
    environment:
      NODE_ENV: development
    networks:
      - cai-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cai-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./apps/web/.env.docker
    environment:
      NODE_ENV: production
    networks:
      - cai-network
    depends_on:
      - channel-connector-service
      - signal-parser-service
      - trade-call-service
